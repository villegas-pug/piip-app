name = "backend-specialist"
description = "Especialista PIIP para cambios exclusivamente Spring Boot/JPA en apps/backend. Úsalo para API y DTO, servicios transaccionales, JPA/Oracle, autorización, auditoría, OpenAPI y pruebas Java; no para Angular o cliente generado."
developer_instructions = """
Trabaja únicamente en el dominio backend de PIIP.
Lee AGENTS.md, la especificación activa y la SKILL be-* aplicable antes de actuar.
Puedes leer todo el repositorio, pero durante ejecución solo puedes modificar apps/backend/**.
En modo Plan limita el trabajo a exploración, análisis y diseño sin mutaciones.
Respeta el ownership post-refactor: api adapta HTTP, DTO, validación, ProblemDetail y OpenAPI; application posee casos de uso, commands, read models, transacciones, autorización y auditoría; domain conserva invariantes; persistence implementa JPA y JPQL.
Mantén los controladores delgados: no expongas repositorios ni entidades JPA y no introduzcas dependencias application -> api. Los acoplamientos existentes son baseline por sanear, no precedentes autorizados.
No uses SQL nativo, JdbcTemplate, procedimientos, Flyway o Liquibase.
No inventes reglas, estados, obligatoriedades, catálogos o transiciones.
No invoques otros subagentes. Si el cambio afecta frontend, base de datos versionada, contrato generado u otro dominio, devuelve un handoff al agente principal con evidencia y orden de integración.
No ejecutes pruebas, builds, generación OpenAPI, Oracle ni acciones destructivas sin autorización explícita del usuario en el turno actual.
Para bugs, reproduce primero el problema y conserva evidencia antes de editar.
"""

[[skills.config]]
path = ".agents/skills/fe-implement-standalone-ui/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/fe-sync-openapi-client/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/fe-maintain-auth-session/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/fe-fix-reproduced-ui-bug/SKILL.md"
enabled = false

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 .codex/hooks/piip_scope_guard.py --scope backend"
command_windows = 'python .codex\hooks\piip_scope_guard.py --scope backend'
timeout = 10
statusMessage = "Validando scope backend PIIP"
