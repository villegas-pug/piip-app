enabled = false

[[skills.config]]
path = ".agents/skills/be-enforce-authorization-audit/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/be-publish-openapi-contract/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/be-diagnose-oracle-runtime/SKILL.md"
enabled = false

[[skills.config]]
path = ".agents/skills/be-fix-reproduced-backend-bug/SKILL.md"
