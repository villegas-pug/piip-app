[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 .codex/hooks/piip_scope_guard.py --scope frontend"
command_windows = 'python .codex\hooks\piip_scope_guard.py --scope frontend'
timeout = 10
statusMessage = "Validando scope frontend PIIP"
