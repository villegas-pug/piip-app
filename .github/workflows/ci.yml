name: PIIP CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and contract tests
        run: mvn verify -Dgroups='!integration'
      - name: Verify delivered Oracle DDL is current
        run: cmp database/generated/piip-oracle.sql apps/backend/target/piip-oracle.sql
        working-directory: .
      - name: Publish OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: piip-openapi
          path: apps/backend/target/piip-openapi.json
      - name: Oracle Testcontainers
        run: mvn verify -Pintegration-tests

  frontend:
    needs: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Download OpenAPI contract
        uses: actions/download-artifact@v4
        with:
          name: piip-openapi
          path: apps/backend/target
      - run: npm run api:generate
      - name: Verify generated client is current
        run: git diff --exit-code -- src/app/api/generated
      - run: npm test -- --watch=false
      - run: npm run build
