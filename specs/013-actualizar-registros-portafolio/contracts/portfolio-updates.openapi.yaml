openapi: 3.1.0
info:
  title: PIIP - Actualización controlada del portafolio
  version: 0.1.0-design
  description: >-
    Contrato de diseño para edición parcial. No reemplaza las operaciones de alta,
    aprobación, derivación o transición existentes.
paths:
  /api/v1/initiatives/{code}:
    patch:
      operationId: updateInitiative
      summary: Actualiza campos permitidos de una iniciativa presentada sin proyecto derivado
      parameters:
        - $ref: '#/components/parameters/RecordCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InitiativeUpdateRequest' }
      responses:
        '200':
          description: Iniciativa actualizada y auditada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioRecordResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /api/v1/projects/{code}:
    patch:
      operationId: updateProject
      summary: Actualiza campos permitidos de un proyecto en ejecución
      parameters:
        - $ref: '#/components/parameters/RecordCode'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectUpdateRequest' }
      responses:
        '200':
          description: Proyecto actualizado y auditado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioRecordResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  parameters:
    RecordCode:
      name: code
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 20 }
  schemas:
    InitiativeUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: >-
        Una propiedad editable ausente conserva su valor. Solo peiObjectiveId,
        poiActivityId y note admiten null explícito. Un body sin cambio efectivo
        se rechaza con 422 aunque cumpla la forma.
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 180 }
        solutionTypeId: { type: integer, format: int64, minimum: 1 }
        sourceId: { type: integer, format: int64, minimum: 1 }
        startDate: { type: string, format: date }
        responsible: { type: string, minLength: 1, maxLength: 300 }
        peiObjectiveId:
          type: [integer, 'null']
          format: int64
          minimum: 1
        poiActivityId:
          type: [integer, 'null']
          format: int64
          minimum: 1
        responsibleUnits:
          $ref: '#/components/schemas/ResponsibleUnitInputs'
        description: { type: string, minLength: 1, maxLength: 1000 }
        note: { type: [string, 'null'], maxLength: 600 }
        digitalComponent:
          type: string
          enum: [YES, NO]
    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      description: >-
        solutionTypeId aplica únicamente al proyecto derivado; un proyecto
        preexistente lo rechaza con 422 y conserva No aplica. Una propiedad
        editable ausente conserva su valor. PEI, POI, nota y resultados clave
        admiten null explícito.
      properties:
        version: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 180 }
        solutionTypeId: { type: integer, format: int64, minimum: 1 }
        sourceId: { type: integer, format: int64, minimum: 1 }
        startDate: { type: string, format: date }
        responsible: { type: string, minLength: 1, maxLength: 300 }
        peiObjectiveId:
          type: [integer, 'null']
          format: int64
          minimum: 1
        poiActivityId:
          type: [integer, 'null']
          format: int64
          minimum: 1
        responsibleUnits:
          $ref: '#/components/schemas/ResponsibleUnitInputs'
        description: { type: string, minLength: 1, maxLength: 1000 }
        keyResults: { type: [string, 'null'], maxLength: 1000 }
        note: { type: [string, 'null'], maxLength: 600 }
        digitalComponent:
          type: string
          enum: [YES, NO]
    ResponsibleUnitInputs:
      type: array
      minItems: 1
      uniqueItems: true
      description: El orden del arreglo es el orden de presentación completo.
      items:
        $ref: '#/components/schemas/ResponsibleUnitInput'
    ResponsibleUnitInput:
      type: object
      additionalProperties: false
      required: [organizationalUnitId]
      properties:
        organizationalUnitId: { type: integer, format: int64, minimum: 1 }
    TechnicalCatalogItemResponse:
      type: object
      required: [code, name, displayOrder, active]
      properties:
        code: { type: string }
        name: { type: string }
        displayOrder: { type: integer }
        active: { type: boolean }
    PersistentCatalogItemResponse:
      type: object
      required: [id, code, name, displayOrder, active]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        displayOrder: { type: integer }
        active: { type: boolean }
    OrganizationalUnitResponse:
      type: object
      required: [id, code, name, active, executingUnitId]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        active: { type: boolean }
        acronym: { type: [string, 'null'] }
        parentId: { type: [integer, 'null'], format: int64 }
        executingUnitId: { type: integer, format: int64 }
    ResponsibleUnitResponse:
      type: object
      required: [organizationalUnit, originalDesignation, displayOrder]
      properties:
        organizationalUnit: { $ref: '#/components/schemas/OrganizationalUnitResponse' }
        originalDesignation: { type: string }
        displayOrder: { type: integer, minimum: 1 }
    PortfolioRecordResponse:
      type: object
      additionalProperties: false
      required:
        - recordType
        - code
        - originCode
        - name
        - solutionType
        - source
        - startDate
        - responsible
        - responsibleUnits
        - description
        - status
        - finalProductType
        - digitalComponent
        - executingUnitId
        - executingUnit
        - updatedAt
        - version
      properties:
        recordType: { $ref: '#/components/schemas/TechnicalCatalogItemResponse' }
        code: { type: string }
        originCode: { type: string }
        name: { type: string }
        solutionType: { $ref: '#/components/schemas/PersistentCatalogItemResponse' }
        source: { $ref: '#/components/schemas/PersistentCatalogItemResponse' }
        startDate: { type: string, format: date }
        responsible: { type: string }
        peiObjective:
          oneOf:
            - $ref: '#/components/schemas/PersistentCatalogItemResponse'
            - type: 'null'
        poiActivity:
          oneOf:
            - $ref: '#/components/schemas/PersistentCatalogItemResponse'
            - type: 'null'
        responsibleUnits:
          type: array
          items: { $ref: '#/components/schemas/ResponsibleUnitResponse' }
        description: { type: string }
        keyResults: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        status: { type: string, description: Etiqueta funcional del estado. }
        finalProductType: { type: string }
        digitalComponent: { type: string, description: Etiqueta funcional Si/No. }
        closingDate: { type: [string, 'null'], format: date }
        technicalOpinionReport: { type: [string, 'null'] }
        formalApprovalDecision: { type: [string, 'null'] }
        finalProductApprovalDocument: { type: [string, 'null'] }
        projectManagementDocumentation: { type: [string, 'null'] }
        finalClosureReport: { type: [string, 'null'] }
        executingUnitId: { type: integer, format: int64 }
        executingUnit: { type: string }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    ProblemDetail:
      type: object
      additionalProperties: true
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        field: { type: string }
        referenceField: { type: string }
        referenceId: { type: [integer, 'null'], format: int64 }
        reason: { type: string }
  responses:
    BadRequest:
      description: JSON, propiedad, presencia, nulo, formato o tamaño inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: El actor no posee ADMINISTRADOR_PIIP sobre la UE real
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Código inexistente o tipo distinto a la ruta
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Versión obsoleta; no se aplican cambios y el cliente debe recargar
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    UnprocessableEntity:
      description: Estado, origen, referencia, UO, campo condicionado o no-op inválido
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
