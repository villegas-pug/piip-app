spring:
  profiles:
    default: dev
  application:
    name: piip-backend
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@srvdb-oracle-desa.domainminag.gob:1521:DEVELOPER}
    username: ${ORACLE_USERNAME:SISPIIP}
    password: ${ORACLE_PASSWORD:D3v3l0p3r$}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://rcgv-services-dev.duckdns.org/keycloak/realms/piip}
  servlet:
    multipart:
      max-file-size: ${PIIP_DOCUMENT_MAX_SIZE:10MB}
      max-request-size: ${PIIP_DOCUMENT_MAX_SIZE:10MB}

server:
  port: ${PORT:4001}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

piip:
  security:
    audience: ${PIIP_JWT_AUDIENCE:ms-piip}
    allowed-origins: ${PIIP_ALLOWED_ORIGINS:http://127.0.0.1:4400,http://localhost:4400}
  documents:
    max-size-bytes: ${PIIP_DOCUMENT_MAX_SIZE:10485760}
  audit:
    retention-days: ${PIIP_AUDIT_RETENTION_DAYS:180}
